[package]
name="trading-hive"
version.workspace=true
edition.workspace=true
[[bin]]
name="trading-hive"
path="src/main.rs"
[dependencies]
chrono.workspace=true
chrono-tz.workspace=true
clap.workspace=true
dotenvy.workspace=true
reqwest.workspace=true
serde_json.workspace=true
uuid.workspace=true
th-domain={path="../domain"}
th-market-data={path="../market-data"}
th-strategy={path="../strategy"}
th-risk={path="../risk"}
th-execution={path="../execution"}
th-bot={path="../bot"}
th-hive={path="../hive"}
th-storage={path="../storage"}
th-memory={path="../memory"}
th-deployment={path="../deployment"}
tokio={workspace=true, features=["rt-multi-thread", "macros"]}

[dev-dependencies]
th-market-data={path="../market-data", features=["test-utils"]}
