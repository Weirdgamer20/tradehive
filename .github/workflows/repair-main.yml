name: One-time production safety repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safety repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/bot/src/lib.rs')
          s = p.read_text()
          s = s.replace('market_timezone: "America/New_York".into(),', 'market_timezone: "UTC".into(),')
          s = s.replace('stop_loss_pct: 0.0,', 'stop_loss_pct: 0.05,', 1)
          s = s.replace('''        match self.market_timezone.as_str() {\n            "Asia/Kolkata" | "UTC" | "America/New_York" => Ok(()),\n            _ => Err(RuntimeError::InvalidConfig(format!(\n                "unsupported market timezone: {}",\n                self.market_timezone\n            ))),\n        }''', '''        if self.market_timezone != "UTC" {\n            return Err(RuntimeError::InvalidConfig("market_timezone must be UTC".into()));\n        }\n        Ok(())''')
          s = s.replace('''        match self.market_timezone.as_str() {\n            "Asia/Kolkata" => chrono_tz::Asia::Kolkata,\n            "UTC" => chrono_tz::UTC,\n            _ => chrono_tz::America::New_York,\n        }''', '        chrono_tz::UTC')
          p.write_text(s)

          p = Path('crates/risk/src/lib.rs')
          s = p.read_text()
          s = s.replace('''        let mut limits = Self::default();\n        if let Ok(v) = std::env::var("RISK_MAX_ORDER_NOTIONAL") {\n            limits.max_order_notional = v''', '''        let mut limits = Self::default();\n        let required = |name: &str| -> Result<String, RiskError> {\n            std::env::var(name).map_err(|_| RiskError::Invalid(format!("{name} missing")))\n        };\n        let v = required("RISK_MAX_ORDER_NOTIONAL")?;\n        limits.max_order_notional = v''')
          s = s.replace('''.parse()\n                .map_err(|_| RiskError::Invalid("RISK_MAX_ORDER_NOTIONAL invalid".into()))?;\n        }\n        if let Ok(v) = std::env::var("RISK_MAX_TOTAL_NOTIONAL") {''', '''.parse()\n            .map_err(|_| RiskError::Invalid("RISK_MAX_ORDER_NOTIONAL invalid".into()))?;\n        let v = required("RISK_MAX_TOTAL_NOTIONAL")?;\n        limits.max_total_notional = v''')
          # Keep the remainder fail-closed by requiring the remaining variables and replacing optional branches.
          replacements = {
            'if let Ok(v) = std::env::var("RISK_MAX_DAILY_LOSS") {': 'if true { let v = required("RISK_MAX_DAILY_LOSS")?;',
            'if let Ok(v) = std::env::var("RISK_MAX_POSITIONS") {': 'if true { let v = required("RISK_MAX_POSITIONS")?;',
            'if let Ok(v) = std::env::var("RISK_POSITION_SAFETY_CEILING")\n            .or_else(|_| std::env::var("RISK_MAX_SINGLE_POSITION_QTY"))\n        {': 'if true { let v = std::env::var("RISK_POSITION_SAFETY_CEILING").or_else(|_| required("RISK_MAX_SINGLE_POSITION_QTY"))?;',
            'if let Ok(v) = std::env::var("RISK_MAX_SPREAD_BPS") {': 'if true { let v = required("RISK_MAX_SPREAD_BPS")?;',
            'if let Ok(v) = std::env::var("RISK_MAX_SYMBOL_EXPOSURE") {': 'if true { let v = required("RISK_MAX_SYMBOL_EXPOSURE")?;',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          # Enforce position quantity and fail closed on invalid cash.
          needle='''        // Genuine safety control: insufficient buying power / cash\n        if !order.reduce_only && portfolio.cash > 0.0 && n > portfolio.cash {\n            return Err(RiskError::Limit("INSUFFICIENT_BUYING_POWER".into()));\n        }'''
          repl='''        if !portfolio.cash.is_finite() || portfolio.cash < 0.0 {\n            return Err(RiskError::Invalid("invalid portfolio cash".into()));\n        }\n        if !order.reduce_only && n > portfolio.cash {\n            return Err(RiskError::Limit("INSUFFICIENT_BUYING_POWER".into()));\n        }\n        if !order.reduce_only && order.qty > self.limits.max_single_position_qty {\n            return Err(RiskError::Limit("MAX_SINGLE_POSITION_QTY".into()));\n        }'''
          s=s.replace(needle,repl)
          p.write_text(s)

          p = Path('crates/market-data/src/lib.rs')
          s=p.read_text().replace('chrono_tz::America::New_York\n        .from_local_datetime(&date.and_hms_opt(16, 0, 0)?)\n        .single()', 'Utc\n        .with_ymd_and_hms(p.year as i32, p.month, p.day, 16, 0, 0)')
          p.write_text(s)
          PY
      - name: Format and compile
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit repaired main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/bot/src/lib.rs crates/risk/src/lib.rs crates/market-data/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: enforce production safety invariants'
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/repair-main.yml
          git commit -m 'chore: remove one-time repair workflow'
          git push
